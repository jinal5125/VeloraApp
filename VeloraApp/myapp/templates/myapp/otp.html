{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora — OTP verification</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="page">

  <!-- Logo -->
  

  <!-- Card -->
  <div class="card">
    <div class="card-logo"><center>vel<span>ora</span></center></div>
    <h5>
        <center style="color:#b85c2a;">OTP verification</center>
    </h5>
    <div class="card-head">   
    </div>

    {% if e_msg %}
      <div class="alert alert-danger" role="alert">
        {{e_msg}}
      </div>
    {% endif %}

    {% if s_msg %}
      <div class="alert alert-success" role="alert">
        {{s_msg}}
      </div>
    {% endif %}

    <form class="form" action="{% url 'otp_verification' %}" method="post">
      {% csrf_token %}
      <div class="field">
        <!-- <label class="label">Email</label> -->
        <div class="input-wrap">
          <!-- <i class="fa-solid fa-envelope inp-icon"></i> -->
          <input type="hidden" class="input" placeholder="Enter Your Email" autocomplete="username" name="email" value="{{email}}">
        </div>
      </div>

      <div class="field">
        <label class="label">OTP</label>
        <div class="input-wrap">
          <i class="fa-solid fa-key inp-icon"></i>
          <input type="text" class="input" placeholder="Enter Your OTP" autocomplete="username" name="otp">
        </div>
      </div>


      
      <button type="submit" class="btn" id="btn">
        <i class="fa-solid fa-right-to-bracket"></i>Change Password 
      </button>

    </form>


    <p class="switch">Click here for? 
      <a href="{% url 'login' %}" style="text-decoration: none;">Sign in →</a>
    </p>

    <p class="switch" id="context"> 
      OTP Timer <span id="timer">30</span> sec
    </p>
    
    <p class="switch" id="resendbtnmain" style="display: none;">
      Click here for? <span id="resendbtn" style="color:#b85c2a; cursor:pointer; font-weight:600;">Resend OTP</span>
    </p>


  </div>

</div>
</body>

<script>
  
  let timer_value = document.getElementById("timer")
  let context_value = document.getElementById("context")
  let btn = document.getElementById("btn");
  let resendbtn = document.getElementById("resendbtn");
  let resendbtnmain = document.getElementById("resendbtnmain");

  let time = 30;

  let timer_interval = null;

  let trial = 1;

  // 1 sec = 1000 ms(mili second)

  function starttimer(){
    timer_interval = setInterval(() => {
    if(time <=0)
    {
      clearInterval(timer_interval);
      console.log("timer expired");
      context_value.innerHTML = "Timer Expired..!!"
      btn.disabled = true;
      btn.style.opacity = 0.6;
      if (trial == 1)
      {
        resendbtnmain.style.display = "block";
      }

      trial = 2;
    }
    else
    {
      time--;
      timer_value.innerHTML = time;
    }
  },1000);
  }

  starttimer();

  resendbtn.addEventListener("click",()=>{
    time = 30;
    btn.disabled = false;
    btn.style.opacity = 1;
    context_value.innerHTML = 'OTP Timer <span id="timer">' + time + '</span> sec';
    timer_value = document.getElementById("timer");
    resendbtnmain.style.display = "none";
    starttimer();
  })
  
</script>

</html>

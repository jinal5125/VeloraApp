{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora — Forgot-Password</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="page">

  <!-- Logo -->
  

  <!-- Card -->
  <div class="card">
    <div class="card-logo"><center>vel<span>ora</span></center></div>
    <h5>
        <center style="color:#b85c2a;">Forgot password</center>
    </h5>
    <div class="card-head">   
    </div>

    {% if e_msg %}
      <div class="alert alert-danger" role="alert">
        {{e_msg}}
      </div>
    {% endif %}

    {% if s_msg %}
      <div class="alert alert-success" role="alert">
        {{s_msg}}
      </div>
    {% endif %}

    <form class="form" action="{% url 'forgot_password' %}" method="post">
      {% csrf_token %}
      <div class="field">
        <label class="label">Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope inp-icon"></i>
          <input type="text" class="input" placeholder="Enter Your Email" autocomplete="username" name="email" >
        </div>
      </div>

      
      <button type="submit" class="btn">
        <i class="fa-solid fa-right-to-bracket"></i> SEND OTP
      </button>

    </form>


    <p class="switch">Click here for? 
      <a href="{% url 'login' %}" style="text-decoration: none;">Sign in →</a><br>
    </p>
    

  </div>

</div>

<script>
  function toggle(id, btn) {
    const inp = document.getElementById(id);
    const ic = btn.querySelector('i');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ic.className = inp.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
  }
</script>
</body>
</html>
